# Paragon Photo: a trimmed copy of craft-libs' workspace manifest at a6b9d9c986f7c4c399632d72d9a4a8c8ea0b86e9, for the one
# vendored crates (crates/ui-contract, crates/ui-widgets). Every other craft crate comes from git at that revision.
